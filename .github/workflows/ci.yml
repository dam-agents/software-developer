# CI for the software-developer definition — the pre-PR validation sweep
# (docs/self-modification.md §9), mechanized, so a definition PR cannot merge
# broken: the app's typecheck, lint and offline tests, the structural
# validator (repo shape, VERSION↔CHANGELOG agreement, dead links, cross-file
# section references, every shim naming a command the CLI has), and the shims
# themselves run end to end as a schedule and a hook call them.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    strategy:
      matrix:
        # the oldest Node that runs TypeScript as it is, and the image's
        node: ["22.18", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: offline tests
        run: npm test
  definition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: structural validator
        run: bash scripts/validate-definition.sh .
      # The shims as a schedule's precheck and the Stop hook call them, with
      # no node_modules: the app's runtime needs nothing installed.
      - name: shims run without dependencies
        run: |
          set -u
          export HOME="$(mktemp -d)"; mkdir -p "$HOME/work"
          printf -- '- repo: acme/widgets\n- mode: interactive\n' > "$HOME/work/CONFIG.md"
          rc=0; bash scripts/precheck.sh || rc=$?
          [ "$rc" = 1 ] || { echo "precheck exited $rc, wanted 1 (interactive: skip)"; exit 1; }
          bash scripts/run-state.sh show
          bash scripts/repo-allowed.sh acme/widgets
          echo '{"session_id":"none"}' | bash scripts/harness/claude-code/enforce-finish.sh
          bash scripts/verify-onboarding.sh --config | tail -1
