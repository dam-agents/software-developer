# yaml-language-server: $schema=https://raw.githubusercontent.com/dam-agents/dam-starter-kits/main/kit.schema.json
# The starter kit this definition is offered as. It lives here, beside the
# definition it describes, so a change to the agent and a change to the kit
# offering it are the same commit.
schemaVersion: v1
id: software-developer
name: Software Developer
description: >-
  Picks up an issue labelled for implementation, writes the change, runs the
  repository's own checks and tests against a cluster in its own sandbox,
  opens a pull request and drives it through review until it is approved.
category: software
icon: code
docsUrl: https://github.com/dam-agents/software-developer
harnesses: [claude-code]

# The verification it runs brings up a cluster in the sandbox, which a pod
# cannot host. An install without virtualization leaves this kit out of the
# catalog entirely rather than offering something it cannot run.
backend: vm

# `self` is this repository, at the commit the kit was resolved at, so an
# agent always runs the definition this file shipped with. Into $HOME, because
# the repository the agent works on belongs in work/.
seed:
  self: true
  into: home

resources:
  cpu: "12"
  memory: 16Gi
  storage: 80Gi
  note: >-
    The sandbox is the cluster node as well as the build host. Sized below the
    reference dev VM (10 CPU / 20GiB / 200GiB) on the assumption that one
    container runtime and one image store need less than two. The disk is
    deliberately under the 100Gi a vm runner claims per owner by default, so
    the image cache it shares that claim with still has room. Disk is fixed at
    create — raise it here before installing if either assumption turns out to
    be wrong, and raise the runner claim with it.

# The cluster and the container runtime are processes in the sandbox: they stop
# when it does. This agent stays up so its cluster does.
hibernationTimeoutMin: 0

env:
  # Tells a repository's cluster tooling it is already inside a VM, so it drives
  # the local k3s instead of looking for a VM manager to create one.
  - name: IS_SANDBOX
    value: "1"

connections:
  - accepts: [github, github-enterprise]
    required: true
    note: Clones the repository, pushes branches and opens pull requests.

schedules:
  # Every ten minutes, around the clock. A cron holds UTC, and at this cadence
  # the hour it lands in is nothing the agent reasons about.
  #
  # `fresh`, and the precheck is what keeps the runs apart. Fires on a
  # continuous schedule queue behind one another, which used to be the whole
  # answer to "there is one cluster" — at the cost of carrying every run's
  # context into the next one forever. A fresh fire opens its own session, so
  # the gate moved into the precheck: it asks the runtime whether the sandbox
  # is still working and steps aside when it is. What a run needs to know about
  # the one before it is in the branches, the labels and the pull requests,
  # which survive a session and a rebuilt sandbox alike.
  - name: software-developer-tick-10m
    cron: "*/10 * * * *"
    sessionMode: fresh
    precheck: $HOME/scripts/precheck.sh
    task: Run the developer tick — CLAUDE.md → "The tick".

  # Every Friday, and ungated: the report is the point even in a quiet week. It
  # checks the instance nobody is watching and repairs nothing.
  - name: software-developer-audit-weekly
    cron: "0 6 * * 5"
    sessionMode: fresh
    task: Run the weekly audit — docs/audit.md.
