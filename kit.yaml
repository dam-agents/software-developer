# yaml-language-server: $schema=https://raw.githubusercontent.com/dam-agents/dam-starter-kits/main/kit.schema.json
# The starter kit this definition is offered as. It lives here, beside the
# definition it describes, so a change to the agent and a change to the kit
# offering it are the same commit.
schemaVersion: v1
id: software-developer
name: Software Developer
description: >-
  Picks up an issue labelled for implementation — or one you ask for in chat —
  writes the change, runs the repository's own checks and tests in its own
  sandbox, opens a pull request and drives it through review until it is
  approved. Watching GitHub unattended is a choice made at onboarding.
category: software
icon: code
docsUrl: https://github.com/dam-agents/software-developer
harnesses: [claude-code]

# A repository's checks may need containers, or a local cluster, which a pod
# cannot host. An install without virtualization leaves this kit out of the
# catalog entirely rather than offering something it cannot run.
backend: vm

# `self` is this repository, at the commit the kit was resolved at, so an
# agent always runs the definition this file shipped with. Into $HOME, because
# the repository the agent works on belongs in work/.
seed:
  self: true
  into: home

resources:
  cpu: "12"
  memory: 16Gi
  storage: 80Gi
  note: >-
    Up to three builds side by side, and whatever services the repository's
    checks start, on one host. The disk is deliberately under the 100Gi a vm
    runner claims per owner by default, so the image cache it shares that
    claim with still has room. Disk is fixed at create — raise it here before
    installing for a repository that needs more, and raise the runner claim
    with it.

# Whatever the repository's checks start — a container runtime, a cluster — is
# a process in the sandbox and stops when it does. This agent stays up so they
# stay warm between runs.
hibernationTimeoutMin: 0

# Required. The agent's tools — builds, containers, whatever they start — call the same services with credentials of their own, or none. Its
# gateway injects a connection's credential only into requests that name the
# connection, and sends the rest as they are; egress policy still applies to
# all of them. A platform that predates the field ignores it.
requireConnectionAddress: true

env:
  # Tells a repository's tooling it is already inside a VM, so it need not look
  # for a VM manager to create one.
  - name: IS_SANDBOX
    value: "1"
  # Tells a repository's tooling it runs in a DAM sandbox, so it can work
  # around what this sandbox cannot do on its own. `PLATFORM_` is the
  # platform's own prefix for the variables it sets.
  - name: PLATFORM_SANDBOX
    value: "1"

# The builds pull from registries, mirrors and package hosts no
# list can enumerate ahead of time. The owner can narrow it after create.
egressPreset: all

connections:
  - accepts: [github, github-enterprise]
    required: true
    note: Clones the repository, pushes branches and opens pull requests.

# Both are created with the agent and held until onboarding completes; the
# operator chooses which stay on (`schedules` in work/CONFIG.md, none with
# `mode: interactive`), and onboarding switches the others off.
schedules:
  # Every ten minutes, around the clock. A cron holds UTC, and at this cadence
  # the hour it lands in is nothing the agent reasons about.
  #
  # `fresh`: every fire opens its own session, and fresh sessions run side by
  # side. That is the point — up to `slots` runs work at once, one issue each,
  # each in a worktree of its own — and the precheck is what bounds it: it lets
  # a run through only while a slot is free, and frees the slots of runs the
  # runtime says are over. What the slots share is serialized by a lock of
  # its own (docs/runs.md). What a run needs to know about the ones before it is in
  # the branches, the labels and the pull requests, which survive a session and
  # a rebuilt sandbox alike.
  - name: software-developer-tick-10m
    cron: "*/10 * * * *"
    sessionMode: fresh
    precheck: $HOME/scripts/precheck.sh
    task: Run the developer tick — CLAUDE.md → "The tick".

  # Every Friday, and ungated: the report is the point even in a quiet week. It
  # checks the instance nobody is watching and repairs nothing.
  - name: software-developer-audit-weekly
    cron: "0 6 * * 5"
    sessionMode: fresh
    task: Run the weekly audit — docs/audit.md.
